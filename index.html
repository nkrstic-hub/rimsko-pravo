<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Римско право — Флеш картице</title><style>body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827;display:grid;place-items:center;min-height:100vh;margin:0}#status{padding:24px;text-align:center}</style></head><body><div id="status">Учитавање картица…</div><script>(async()=>{try{const r=await fetch('./payload0.txt?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const b=(await r.text()).trim(),s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){console.error(e);document.getElementById('status').textContent='Није могуће учитати картице. Освежи страницу за тренутак.'}})()</script></body></html>
