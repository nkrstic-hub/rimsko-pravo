<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Римско право — Flash картице</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#20242a;--muted:#68707a;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626;--border:#dfe3e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,select,input{font:inherit}.wrap{max-width:920px;margin:auto;padding:16px}.top{position:sticky;top:0;z-index:5;background:rgba(244,245,247,.96);backdrop-filter:blur(8px);padding-bottom:10px}.title{font-size:clamp(24px,6vw,40px);font-weight:800;text-align:center;margin:10px 0 4px}.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:12px}.controls{display:grid;grid-template-columns:1fr;gap:8px}.controls input,.controls select,.controls button{min-height:46px;border:1px solid var(--border);border-radius:12px;padding:9px 12px;background:#fff}.controls button{cursor:pointer;font-weight:700}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;min-height:58vh;display:flex;flex-direction:column;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.05)}.badge{align-self:flex-start;border-radius:999px;padding:5px 9px;background:#eef0f4;color:#59616b;font-size:12px;font-weight:700;margin-bottom:18px}.important{background:#fff4cc;color:#8a6200}.q{font-size:clamp(22px,5vw,34px);font-weight:800;line-height:1.3}.answer{margin-top:22px;padding-top:20px;border-top:1px solid var(--border);font-size:clamp(18px,4.3vw,24px);line-height:1.55;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button{flex:1;min-width:150px;min-height:52px;border:0;border-radius:14px;color:#fff;font-weight:800;cursor:pointer}.show{background:var(--accent)}.yes{background:var(--ok)}.no{background:var(--bad)}.star{background:#f1f3f5!important;color:#333!important;border:1px solid var(--border)!important}.nav{display:flex;gap:10px;margin-top:10px}.nav button{flex:1;min-height:48px;border:1px solid var(--border);border-radius:12px;background:#fff;font-weight:700}.progress{text-align:center;color:var(--muted);margin:10px 0;font-size:14px}.result{background:#fff;border:1px solid var(--border);border-radius:20px;padding:26px;text-align:center}.result h2{margin-top:0}.hidden{display:none}.small{font-size:13px;color:var(--muted)}@media(min-width:700px){.controls{grid-template-columns:2fr 1fr auto auto auto}.card{padding:36px}.wrap{padding:24px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="title">Римско право</div>
<div class="sub">Flash картице за учење и самопроверу</div>
<div class="controls">
<input id="search" placeholder="Претражи питања...">
<select id="sectionSelect"><option value="">Сви периоди</option><option>Период Краљева</option><option>Период Ране Републике</option><option>Период Позне Републике</option><option>Период Принципата</option><option>Период Домината</option><option>Рецепција Римског Права</option><option>Додатна питања</option></select>
<button id="importantFilter">★ Само важна</button><button id="shuffle">🔀 Промешај</button><button id="reset">↺ Нова рунда</button>
</div></div>
<div id="app"></div>
</div>
<script>
const ALL = __DATA__;
ALL.forEach((c,i)=>c.id=i);
const sourceImportant=new Set(ALL.filter(c=>c.important).map(c=>c.id));
let personalImportant=new Set(JSON.parse(localStorage.getItem('rimsko_pravo_vazna_pitanja_v1')||'[]').map(Number));
let deck=[...ALL], pos=0, answerShown=false, wrongIds=new Set(), onlyImportant=false;
const $=id=>document.getElementById(id);
function isImportant(c){return sourceImportant.has(c.id)||personalImportant.has(c.id)}
function saveImportant(){localStorage.setItem('rimsko_pravo_vazna_pitanja_v1',JSON.stringify([...personalImportant]))}
function toggleImportant(){const c=deck[pos];if(!c)return;if(personalImportant.has(c.id))personalImportant.delete(c.id);else personalImportant.add(c.id);saveImportant();render()}
function applyFilters(){const s=$('search').value.trim().toLowerCase(), sec=$('sectionSelect').value;deck=ALL.filter(c=>(!s||c.q.toLowerCase().includes(s)||c.a.toLowerCase().includes(s))&&(!sec||c.section===sec)&&(!onlyImportant||isImportant(c)));pos=0;answerShown=false;wrongIds.clear();render()}
function render(){const app=$('app');if(!deck.length){app.innerHTML='<div class="result"><h2>Нема резултата</h2><p>Промени претрагу или филтер.</p></div>';return}if(pos>=deck.length)pos=deck.length-1;const c=deck[pos];app.innerHTML=`<div class="progress">${pos+1} / ${deck.length}</div><div class="card"><div class="badge">${esc(c.section)}${isImportant(c)?' · ★ ВАЖНО':''}</div><div class="q">${esc(c.q)}</div>${answerShown?`<div class="answer">${esc(c.a)}</div><div class="actions"><button class="yes" onclick="mark(true)">✓ ТАЧНО</button><button class="no" onclick="mark(false)">✗ НЕТАЧНО</button></div>`:`<div class="actions"><button class="show" onclick="showAnswer()">Прикажи одговор</button></div>`}<div class="actions"><button class="star" onclick="toggleImportant()">${personalImportant.has(c.id)?'★ ВАЖНО':'☆ Означи као важно'}</button></div></div><div class="nav"><button onclick="prev()">← Претходно</button><button onclick="next()">Следеће →</button></div>`}
function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function showAnswer(){answerShown=true;render()}
function mark(correct){const c=deck[pos];if(correct)wrongIds.delete(c.id);else wrongIds.add(c.id);if(pos<deck.length-1){pos++;answerShown=false;render()}else showResult()}
function showResult(){const total=deck.length, wrong=wrongIds.size, correct=total-wrong;$('app').innerHTML=`<div class="result"><h2>Рунда завршена 🎉</h2><p>Тачно: <b>${correct}</b></p><p>Нетачно: <b>${wrong}</b></p><p class="small">Укупно картица: ${total}</p>${wrong?`<button class="show" style="border:0;border-radius:12px;padding:14px 18px;font-weight:800;color:#fff;background:var(--accent);cursor:pointer" onclick="repeatWrong()">🔁 Понови само погрешна (${wrong})</button>`:''}<button style="margin-left:8px;border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-weight:800;background:#fff;cursor:pointer" onclick="resetRound()">Нова рунда</button></div>`}
function repeatWrong(){deck=deck.filter(c=>wrongIds.has(c.id));pos=0;answerShown=false;wrongIds.clear();render()}
function next(){if(pos<deck.length-1){pos++;answerShown=false;render()}}
function prev(){if(pos>0){pos--;answerShown=false;render()}}
function shuffleDeck(){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}pos=0;answerShown=false;render()}
function resetRound(){applyFilters()}
$('search').addEventListener('input',applyFilters);$('sectionSelect').addEventListener('change',applyFilters);$('importantFilter').onclick=()=>{onlyImportant=!onlyImportant;$('importantFilter').textContent=onlyImportant?'★ Сва питања':'★ Само важна';applyFilters()};$('shuffle').onclick=shuffleDeck;$('reset').onclick=resetRound;
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!answerShown)showAnswer()}else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev()});
render();
</script>
</body>
</html>
