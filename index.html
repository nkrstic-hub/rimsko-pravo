<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Римско право — Flash картице</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#20242a;display:grid;place-items:center;min-height:100vh;margin:0}#status{padding:24px;text-align:center;color:#68707a}</style>
</head>
<body>
<div id="status">Учитавање картица…</div>
<script>
(async()=>{
 try{
  const r=await fetch('./payload0.txt?'+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('payload '+r.status);
  const b64=(await r.text()).trim();
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  document.title=doc.title;
  document.head.innerHTML=doc.head.innerHTML;
  document.body.innerHTML=doc.body.innerHTML;
  const scripts=[...doc.querySelectorAll('script')];
  for(const oldScript of scripts){
    if(oldScript.textContent.trim()) (0,eval)(oldScript.textContent);
  }
 }catch(e){
  document.body.innerHTML='<div id="status">Није могуће учитати картице. Освежи страницу за тренутак.</div>';
  console.error(e);
 }
})();
</script>
</body>
</html>
