name: Deploy Roman Law flashcards to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build direct HTML
        run: |
          set -e
          base64 -d payload0.txt > payload.gz
          python3 patch_site.py
          test -s index.html
          grep -q 'Римско право' index.html
          grep -q 'const ALL' index.html
          grep -q 'rimsko_pravo_izmenjena_pitanja_v1' index.html
          grep -q '</html>' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
