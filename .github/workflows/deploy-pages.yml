name: Deploy Roman Law flashcards to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build direct HTML
        run: |
          set -e
          base64 -d payload0.txt > payload.gz
          python3 - <<'PY'
          import zlib
          data = open('payload.gz','rb').read()
          if data[:2] != b'\x1f\x8b':
              raise SystemExit('Not gzip data')
          pos = 10
          flg = data[3]
          if flg & 4:
              n = int.from_bytes(data[pos:pos+2], 'little'); pos += 2 + n
          if flg & 8:
              pos = data.index(b'\0', pos) + 1
          if flg & 16:
              pos = data.index(b'\0', pos) + 1
          if flg & 2:
              pos += 2
          html = zlib.decompress(data[pos:-8], -15)
          open('index.html','wb').write(html)
          PY
          test -s index.html
          grep -q 'Римско право' index.html
          grep -q 'const ALL' index.html
          grep -q '</html>' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
